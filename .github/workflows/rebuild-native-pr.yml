name: Rebuild native binaries for PR

# Triggered after the main CI workflow completes on a pull_request event.
# Runs with repo secrets (unlike pull_request triggers from forks).
# Rebuilds ALL native binaries via Docker cross-compilation on ubuntu-latest,
# signs macOS libraries with rcodesign (no macOS runner required), then
# commits the updated binaries back to the PR branch (if maintainerCanModify)
# or fails.
#
# Security model: fork-controlled code (make) runs ONLY in the build-native
# job which has NO secrets and NO write permissions. Signing secrets and the
# GH_PAT are exclusively available in the sign-and-push job, which checks out
# only the base repo (trusted code) and downloads pre-built artifacts from the
# build-native job via GitHub Actions artifact storage.
#
# Can also be triggered manually via workflow_dispatch with a target branch
# (e.g. master or jline-3.x) to rebuild and commit binaries directly after
# merging the CI infrastructure PRs.
on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to rebuild native binaries on (e.g. master or jline-3.x)'
        required: true
        default: 'master'

# One run at a time per PR branch — cancel any in-progress rebuild if a new
# commit lands before the previous rebuild finishes.
concurrency:
  group: rebuild-native-pr-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || inputs.branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Job 1: resolve PR metadata ────────────────────────────────────────────
  pr-info:
    name: Resolve PR metadata
    # For workflow_run: only act on pull_request runs.
    # Allow both 'success' and 'failure' conclusions — check-native fails when
    # binaries are stale, which is exactly when this workflow should run.
    if: |-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure') &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.actor.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip:                  ${{ steps.resolve.outputs.skip }}
      pr_number:             ${{ steps.resolve.outputs.pr_number }}
      head_ref:              ${{ steps.resolve.outputs.head_ref }}
      head_repo:             ${{ steps.resolve.outputs.head_repo }}
      head_sha:              ${{ steps.resolve.outputs.head_sha }}
      base_ref:              ${{ steps.resolve.outputs.base_ref }}
      maintainer_can_modify: ${{ steps.resolve.outputs.maintainer_can_modify }}

    steps:
      - name: Resolve target (PR branch or manual branch)
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              // Manual trigger — commit directly to the target branch
              const branch = context.payload.inputs.branch;
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   `heads/${branch}`,
              });
              core.setOutput('skip',                  'false');
              core.setOutput('pr_number',             '');
              core.setOutput('head_ref',              branch);
              core.setOutput('head_repo',             `${context.repo.owner}/${context.repo.repo}`);
              core.setOutput('head_sha',              ref.object.sha);
              core.setOutput('base_ref',              branch);
              core.setOutput('maintainer_can_modify', 'true');
              return;
            }
            // workflow_run path — check if check-native failed (stale binaries)
            const runId = context.payload.workflow_run.id;
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const checkNative = jobs.jobs.find(j => j.name === 'Check native binaries are up-to-date');
            if (!checkNative) {
              core.warning('Job "Check native binaries are up-to-date" not found in triggering run — was it renamed? Skipping rebuild.');
              core.setOutput('skip', 'true');
              return;
            }
            if (checkNative.conclusion !== 'failure') {
              core.notice('check-native passed — native binaries are up to date, skipping rebuild.');
              core.setOutput('skip', 'true');
              return;
            }
            // Find the associated open PR
            const headSha  = context.payload.workflow_run.head_sha;
            const headRepo = context.payload.workflow_run.head_repository.full_name;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              head:  `${headRepo.split('/')[0]}:${context.payload.workflow_run.head_branch}`,
              per_page: 5,
            });
            const pr = prs.find(p => p.head.sha === headSha);
            if (!pr) {
              core.notice('No open PR found for this workflow run — skipping.');
              core.setOutput('skip', 'true');
              return;
            }
            // Fetch the individual PR to get maintainer_can_modify (the list endpoint returns null).
            const { data: prFull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: pr.number,
            });
            core.setOutput('skip',                  'false');
            core.setOutput('pr_number',             String(prFull.number));
            core.setOutput('head_ref',              prFull.head.ref);
            core.setOutput('head_repo',             prFull.head.repo.full_name);
            core.setOutput('head_sha',              prFull.head.sha);
            core.setOutput('base_ref',              prFull.base.ref);
            core.setOutput('maintainer_can_modify', String(prFull.maintainer_can_modify));

  # ─── Job 2: build native binaries from fork code (NO secrets) ──────────────
  build-native:
    name: Build all native binaries (untrusted fork code, no secrets)
    needs: pr-info
    if: needs.pr-info.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # No write permissions — this job runs fork-controlled Makefile targets.
    # Secrets are intentionally NOT available here.
    permissions:
      contents: read

    steps:
      - name: Checkout fork branch (fork code — no secrets in this job)
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.pr-info.outputs.head_repo }}
          # Pin to the exact SHA vetted by CI — prevents TOCTOU where a new
          # commit lands between CI completion and this job's checkout.
          ref:        ${{ needs.pr-info.outputs.head_sha }}
          persist-credentials: false
          # Required for checkout@v7 in workflow_run context when repository is a fork.
          allow-unsafe-pr-checkout: true

      - name: Set up QEMU (for musl-arm64 cross-compilation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Rebuild all native binaries (Docker cross-compilation)
        working-directory: native
        run: make native-all-no-mac

      - name: Upload built native binaries as artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-binaries-${{ github.run_id }}
          path: native/src/main/resources/org/jline/nativ/
          retention-days: 1
          if-no-files-found: error

  # ─── Job 3: sign (Apple cert) and push — ONLY trusted base-repo code ───────
  sign-and-push:
    name: Sign macOS binaries and push (trusted job, no fork code)
    needs: [pr-info, build-native]
    if: needs.pr-info.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Check out the BASE repo (jline/jline3) — no fork code runs here.
      # We fetch the PR head from the fork's repo into a local branch so we
      # can commit the rebuilt binaries on top of the correct history.
      - name: Checkout base repository (trusted — no fork code runs here)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref:        ${{ needs.pr-info.outputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head and switch to it
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HEAD_REPO: ${{ needs.pr-info.outputs.head_repo }}
          HEAD_REF: ${{ needs.pr-info.outputs.head_ref }}
          HEAD_SHA: ${{ needs.pr-info.outputs.head_sha }}
        run: |
          # Fetch the fork's PR branch by pinned SHA (not branch name) to avoid a
          # TOCTOU window where a new push lands between build-native and this job.
          # No fork code is executed — we only need the git history baseline.
          git -c "url.https://x-access-token:${GH_PAT}@github.com/.insteadOf=https://github.com/" \
              fetch "https://github.com/${HEAD_REPO}.git" "+${HEAD_SHA}:refs/remotes/pr/head"
          git checkout -b pr-branch refs/remotes/pr/head

      - name: Download built native binaries
        uses: actions/download-artifact@v8
        with:
          name: native-binaries-${{ github.run_id }}
          path: native/src/main/resources/org/jline/nativ/

      - name: Log in to GHCR (for macOS crossbuild images)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build macOS native binaries (trusted job — registry access available)
        working-directory: native
        run: make native-mac

      - name: Generate checksums of unsigned macOS binaries
        run: |
          cd native/src/main/resources/org/jline/nativ/Mac || exit 1
          sha256sum */libjlinenative.jnilib > checksums.sha256
          echo "Unsigned macOS checksums:"
          cat checksums.sha256

      - name: Install rcodesign
        run: |
          RCODESIGN_VERSION=0.29.0
          EXPECTED_SHA256="dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
          curl -sSfL \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/rcodesign.tar.gz
          echo "${EXPECTED_SHA256}  /tmp/rcodesign.tar.gz" | sha256sum -c -
          tar --strip-components=1 -xzf /tmp/rcodesign.tar.gz --wildcards '*/rcodesign'
          rm /tmp/rcodesign.tar.gz
          chmod +x rcodesign
          ./rcodesign --version

      - name: Sign macOS native libraries
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          NATIVE_MAC_DIR=native/src/main/resources/org/jline/nativ/Mac
          for arch in x86_64 arm64; do
            lib="$NATIVE_MAC_DIR/$arch/libjlinenative.jnilib"
            if [ ! -f "$lib" ]; then
              echo "ERROR: $lib not found"; exit 1
            fi
            echo "Signing $lib ..."
            ./rcodesign sign \
              --p12-file "$CERT_PATH" \
              --p12-password "$APPLE_CERTIFICATE_PASSWORD" \
              --code-signature-flags runtime \
              "$lib"
            echo "Verifying $lib ..."
            ./rcodesign verify "$lib"
            echo "✓ $lib signed and verified"
          done
          rm -f "$CERT_PATH"

      - name: Check for binary diffs
        id: diff
        run: |
          git add native/src/main/resources/org/jline/nativ/
          if git diff --cached --quiet; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "All native binaries are up to date ✓"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Binary diffs detected:"
            git diff --cached --name-only
          fi

      - name: Commit and push updated binaries
        if: |-
          steps.diff.outputs.up_to_date == 'false' &&
          needs.pr-info.outputs.maintainer_can_modify == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HEAD_REF: ${{ needs.pr-info.outputs.head_ref }}
          HEAD_REPO: ${{ needs.pr-info.outputs.head_repo }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild and sign native binaries [skip ci]"
          # Push to the fork repo (head_repo), not to the base repo (origin).
          # For same-repo PRs head_repo == base repo; for fork PRs it differs.
          git -c "url.https://x-access-token:${GH_PAT}@github.com/.insteadOf=https://github.com/" \
              push "https://github.com/${HEAD_REPO}.git" HEAD:"${HEAD_REF}"

      - name: Comment on PR after commit
        if: |-
          steps.diff.outputs.up_to_date == 'false' &&
          needs.pr-info.outputs.maintainer_can_modify == 'true' &&
          needs.pr-info.outputs.pr_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: ${{ needs.pr-info.outputs.pr_number }},
              body: [
                '🤖 Native binaries have been rebuilt and signed automatically.',
                '',
                'CI was not re-triggered on this commit (`[skip ci]`). Trigger a new CI run manually if needed.',
              ].join('\n'),
            });

      - name: Fail — binaries out of date and maintainerCanModify=false
        if: |-
          steps.diff.outputs.up_to_date == 'false' &&
          needs.pr-info.outputs.maintainer_can_modify != 'true'
        run: |
          echo "::error::Native binaries are out of date and maintainerCanModify=false."
          echo "::error::Please enable 'Allow edits from maintainers' on this PR, or rebuild and commit the binaries yourself."
          echo "Changed files:"
          git diff --cached --name-only
          exit 1
