#
# Release workflow
#
# Secrets:
# - GPG_SIGNING_KEY (private key with armor)
# - GPG_PASSPHRASE (the private key passphrase)
# - GPG_KEY_FINGERPRINT (fingerprint and not hash)
# - MAVEN_USER (token user generated by central.sonatype.org)
# - MAVEN_PASSWORD (token password generated by central.sonatype.org)
#

name: Manual Maven Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    name: Release to Maven Central
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:

      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # Full history for git describe
          ref: ${{ github.ref }}  # Ensures we're on the exact tag when triggered by tag push

      - name: Verify tag state
        id: version
        run: |
          version=${GITHUB_REF#refs/tags/}
          if [[ "$version" == *-* ]]; then
            echo "Tag '$version' is not a release version (contains '-'), skipping"
            exit 1
          fi
          git fetch --tags
          echo "All recent tags:"
          git tag -l --sort=version:refname | head -5
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Git describe: $(git describe --tags --always)"
          echo "Tag: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_KEY_FINGERPRINT }}

      - name: Validate version
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$version' (expected X.Y.Z)"
            exit 1
          fi
          echo "Version validated: $version"

      - name: Release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MVX_USE_SYSTEM_JAVA: true
        run: |
          ./mvx mvn -B deploy -Dnjord.autoPublish -Dnisse.jgit.dynamicVersion=${{ steps.version.outputs.version }} -Pbundle,javadoc,format-check,sign -s .github/release-settings.xml

      - name: Post release
        env:
          GH_TOKEN: ${{ github.token }}
          MVX_USE_SYSTEM_JAVA: true
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh extension install valeriobelli/gh-milestone
          version="$RELEASE_VERSION"
          echo "Trying to find milestone $version"
          milestone=$(gh milestone list --json id,title,state  --jq "map_values(select(.title == \"${version}\" and .state == \"OPEN\")).[].number")
          if [ ! -z "$milestone" ]; then
              echo "Found milestone $version, closing it"
              gh milestone edit $milestone --state closed
          fi

          # Parse semantic version and increment patch version
          if [[ $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}

            # Increment patch version for next development cycle
            next_patch=$((patch + 1))
            next_version="${major}.${minor}.${next_patch}"

            echo "Preparing development $next_version"
            echo "Trying to find milestone $next_version"

            milestone=$(gh milestone list --json id,title,state --jq "map_values(select(.title == \"${next_version}\" and .state == \"OPEN\")).[].number")
            if [ -z "$milestone" ]; then
              echo "Creating milestone $next_version"
              gh milestone create --title $next_version || echo "Milestone $next_version already exists, skipping"
            fi
          else
            echo "ERROR: Version $version is not a valid semantic version (x.y.z)"
            exit 1
          fi

          version="$RELEASE_VERSION"

          # Find a Release Drafter draft targeting master.  Release Drafter
          # tags its drafts with the *next minor* version (e.g. 4.5.0) so a
          # tag-exact match never works for patch releases (e.g. 4.4.2).
          # Instead, grab the latest draft whose target_commitish is master
          # regardless of its tag, retag it to the actual release version,
          # and publish it.
          # The gh api call must succeed; if it fails (auth error, rate
          # limit, network issue) the step should abort — not silently
          # skip the draft and create a duplicate release.
          draft_id=$(gh api repos/${{ github.repository }}/releases --paginate \
            --jq "[.[] | select(.draft == true and .target_commitish == \"master\")] | first | .id")
          echo "Draft lookup result: draft_id=$draft_id"

          # Check whether a (non-draft) release already exists for this tag.
          # gh api prints the full error JSON to stdout on 404, so check the
          # HTTP status instead of relying on --jq output.
          http_status=$(gh api repos/${{ github.repository }}/releases/tags/${version} \
            -i 2>/dev/null | head -1 | awk '{print $2}' || true)

          if [ "$http_status" = "200" ]; then
            echo "Release $version already exists, updating title"
            gh release edit "$version" --title "JLine $version" --target master
          elif [ -n "$draft_id" ] && [ "$draft_id" != "null" ] && [ "$http_status" = "404" ]; then
            echo "Publishing Release Drafter draft (id=$draft_id) as $version"
            gh api repos/${{ github.repository }}/releases/$draft_id \
              -X PATCH \
              -f tag_name="$version" \
              -f name="JLine $version" \
              -f target_commitish=master \
              -F draft=false \
              --silent
            echo "Published: https://github.com/${{ github.repository }}/releases/tag/$version"
          elif [ "$http_status" = "404" ]; then
            echo "No draft and no existing release found, creating release for $version"
            gh release create "$version" --verify-tag --generate-notes --title "JLine $version" --target master
          else
            echo "::error::Unexpected status $http_status when looking up release $version"
            exit 1
          fi
