name: Build crossbuild macOS images

on:
  push:
    branches:
      - master
    paths:
      - 'native/docker/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: crossbuild-macos-legacy
            dockerfile: native/docker/Dockerfile.macos-legacy
            tag: ghcr.io/jline/jline3/crossbuild-macos-legacy:latest
          - name: crossbuild-macos-modern
            dockerfile: native/docker/Dockerfile.macos-modern
            tag: ghcr.io/jline/jline3/crossbuild-macos-modern:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: native/docker
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ matrix.image.tag }}
