name: build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-22.04, windows-latest, macos-latest ]
        java: [ '22', '25' ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.java }}-
            ${{ runner.os }}-maven-

      - name: Cache mvx tools
        uses: actions/cache@v6
        with:
          path: ~/.mvx/tools
          key: ${{ runner.os }}-mvx-tools-${{ hashFiles('.mvx/config.json5', '.mvx/mvx.properties') }}
          restore-keys: |
            ${{ runner.os }}-mvx-tools-

      - name: Verify macOS native signatures
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          NATIVE_DIR=native/src/main/resources/org/jline/nativ/Mac
          # x86 (32-bit) was dropped on macOS 10.15+ and is not re-signed in CI;
          # only verify x86_64 and arm64 to match the sign loop.
          for arch in x86_64 arm64; do
            LIB="$NATIVE_DIR/$arch/libjlinenative.jnilib"
            if [ ! -f "$LIB" ]; then
              echo "::error::$LIB not found"
              exit 1
            fi
            echo "Checking $LIB ..."
            codesign --verify --strict --verbose "$LIB" 2>&1
            INFO=$(codesign --display --verbose=4 "$LIB" 2>&1)
            echo "$INFO"
            if ! echo "$INFO" | grep -q "Authority=Developer ID Application:"; then
              echo "::error::$LIB is not signed with a Developer ID Application certificate"
              exit 1
            fi
            echo "✓ $LIB is signed with Developer ID"
          done
          echo "All macOS native libraries are signed ✓"

      - name: Build with maven
        run: ./mvx mvn --no-transfer-progress verify
        env:
          MVX_USE_SYSTEM_JAVA: true
          MVX_PARALLEL_DOWNLOADS: 1
          MVX_DOWNLOAD_TIMEOUT: 300
          MVX_HTTP_TIMEOUT: 300
        if: matrix.os != 'windows-latest'

      - name: Build with maven
        run: |
          set PATH=%JAVA_HOME%\bin;C:\Windows\System32\WindowsPowerShell\v1.0\
          mvx.cmd mvn --no-transfer-progress verify
        env:
          MVX_USE_SYSTEM_JAVA: true
          MVX_PARALLEL_DOWNLOADS: 1
          MVX_DOWNLOAD_TIMEOUT: 300
          MVX_HTTP_TIMEOUT: 300
        shell: cmd
        if: matrix.os == 'windows-latest'

  native-image:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        profile: [ native-image-jni, native-image-ffm ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-graalvm-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-graalvm-
            ${{ runner.os }}-maven-

      - name: Cache mvx tools
        uses: actions/cache@v6
        with:
          path: ~/.mvx/tools
          key: ${{ runner.os }}-mvx-tools-${{ hashFiles('.mvx/config.json5', '.mvx/mvx.properties') }}
          restore-keys: |
            ${{ runner.os }}-mvx-tools-

      - name: Build project
        run: ./mvx mvn -B --no-transfer-progress install -DskipTests
        env:
          MVX_USE_SYSTEM_JAVA: true
          MVX_PARALLEL_DOWNLOADS: 1
          MVX_DOWNLOAD_TIMEOUT: 300
          MVX_HTTP_TIMEOUT: 300

      - name: Build and verify native image
        run: ./mvx mvn -B --no-transfer-progress verify -pl graal -P${{ matrix.profile }}
        env:
          MVX_USE_SYSTEM_JAVA: true
          MVX_PARALLEL_DOWNLOADS: 1
          MVX_DOWNLOAD_TIMEOUT: 300
          MVX_HTTP_TIMEOUT: 300

  check-native:
    name: Check native binaries are up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check if native sources changed
        id: changes
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- native/src/main/native/ | wc -l)
          echo "native_changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" -eq 0 ]; then
            echo "No native C/H source changes — skipping native rebuild check"
          fi

      - name: Set up QEMU (for musl-arm64)
        if: steps.changes.outputs.native_changed != '0'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Rebuild all non-macOS native binaries
        if: steps.changes.outputs.native_changed != '0'
        working-directory: native
        run: |
          make linux-x86_64 linux-arm linux-armv7 linux-arm64 linux-ppc64
          make linux-x86 linux-armv6
          make linux-musl-x86_64 linux-musl-arm64
          make win-x86 win-x86_64 win-arm64
          make freebsd-x86 freebsd-x86_64

      - name: Check no binary diffs (excluding macOS)
        if: steps.changes.outputs.native_changed != '0'
        run: |
          {
            git diff --name-only native/src/main/resources/ | grep -v '/Mac/'
            git ls-files --others --exclude-standard native/src/main/resources/ | grep -v '/Mac/'
          } > /tmp/changed-binaries.txt || true
          if [ -s /tmp/changed-binaries.txt ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && \
               [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "::error::Native binaries are out of date. The rebuild-native-pr workflow will push updated binaries automatically if maintainerCanModify=true."
            else
              echo "::error::Native binaries are out of date. Run 'make' in the native/ directory and commit the updated binaries."
            fi
            cat /tmp/changed-binaries.txt
            git diff --stat native/src/main/resources/ | grep -v '/Mac/'
            exit 1
          fi
          echo "All non-macOS native binaries are up to date ✓"


